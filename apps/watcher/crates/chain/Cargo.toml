# The watcher: lightwalletd sources, view-only trial decryption, the sync loop with reorg
# handling, and the health view (rules §4, B-08, B-28).
[package]
name = "sealed-chain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json = "=1.0.151"

[dependencies]
sealed-core = { path = "../core" }
sealed-store = { path = "../store" }
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time"] }
tonic = { version = "=0.14.6", features = ["tls-ring", "tls-webpki-roots", "transport"] }
tracing = "=0.1.44"
zcash_client_backend = { version = "=0.25.0-pre.1", features = ["lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots", "lightwalletd-tonic-transport", "orchard"] }
zcash_keys = { version = "=0.17.0-pre.1", features = ["orchard", "sapling"] }
zcash_primitives = "=0.31.0-pre.1"
zcash_protocol = "=0.11.0-pre.0"
