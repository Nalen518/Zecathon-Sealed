# The Inbox API (contract §6) and the service binary that runs it next to the watcher
# (rules §2, B-01, B-12).
[package]
name = "sealed-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "sealed"
path = "src/main.rs"

[dependencies]
argon2 = "=0.6.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = "=0.22.1"
blake2 = "=0.10.6"
getrandom = "=0.4.3"
sealed-chain = { path = "../chain" }
sealed-core = { path = "../core" }
sealed-store = { path = "../store" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
zcash_protocol = "=0.11.0-pre.0"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
zcash_keys = { version = "=0.17.0-pre.1", features = ["orchard", "sapling"] }
