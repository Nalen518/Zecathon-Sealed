# Sealed watcher and Inbox API (backend rules §7.4). One Rust service, four crates.
# Exact versions only (NFR-9, rules §7.3). The spikes under spikes/ are not members.
[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/chain", "crates/api"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
